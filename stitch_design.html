<script>
    document.getElementById('start-btn').addEventListener('click', function() {
      const input = document.getElementById('quiz-topic');
      if (!input.value.trim()) {
        input.classList.add('animate-shake');
        setTimeout(() => input.classList.remove('animate-shake'), 500);
        return;
      }
      
      this.innerHTML = `
        <span class="material-symbols-outlined animate-spin">progress_activity</span>
        <span>Generating...</span>
      `;
      this.classList.add('pointer-events-none', 'opacity-80');
      
      // Simulate transition to quiz
      setTimeout(() => {
        window.location.hash = '#quiz-loading';
      }, 1200);
    });

    // Custom shake animation via style injection for interaction feedback
    if (!document.getElementById('shake-style')) {
      const style = document.createElement('style');
      style.id = 'shake-style';
      style.innerHTML = `
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-8px); }
          75% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
      `;
      document.head.appendChild(style);
    }
  </script>
